<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" type="text/css" href="/css/override.css">
  {% seo %}
  {% feed_meta %}
  {% if jekyll.environment == 'production' and site.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}
</head>
<body>

  <div id="header_wrap" class="outer">
    <header class="inner">
      <h1 id="project_title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <h2 id="project_tagline">{{ site.description }}</h2>
      <nav class="site-nav">
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} class="active"{% endif %}>Archive</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
        <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} class="active"{% endif %}>Support</a>
      </nav>
    </header>
  </div>

  <div id="main_content_wrap" class="outer">
    <section id="main_content" class="inner">
      {{ content }}
    </section>
  </div>

  <div id="footer_wrap" class="outer">
    <footer class="inner">
      {% include footer.html %}
    </footer>
  </div>

</body>
</html>
